# Overrides for prod — applied on top of values.yaml:
#   helm upgrade --install hn-crawler charts/hn-crawler \
#     -f charts/hn-crawler/values-prod.yaml --set image.tag=<release-tag>
#
# replicaCount and autoscaling.enabled are deliberately NOT bumped
# here. usage.sqlite is single-writer on a PVC that is itself
# ReadWriteOnce — more than 1 replica would mean concurrent writers to
# one file, or Pods that can't even schedule together depending on the
# storage backend. Real horizontal scaling would require moving usage
# tracking off SQLite first; until then, prod availability comes from
# the PDB + probes + resource headroom below, not extra replicas.

image:
  tag: prod

replicaCount: 1

resources:
  requests:
    cpu: 200m
    memory: 192Mi
  limits:
    cpu: 750m
    memory: 384Mi

persistence:
  enabled: true
  size: 1Gi
  # Set to your cluster's StorageClass for prod (e.g. a replicated one)
  # instead of leaving it to the default — left blank here since this
  # chart doesn't assume a specific cloud provider.
  storageClassName: ""

autoscaling:
  enabled: false

pdb:
  enabled: true
  minAvailable: 1
