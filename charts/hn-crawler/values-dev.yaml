# Overrides for the dev environment — applied on top of values.yaml:
#   helm upgrade --install hn-crawler-dev charts/hn-crawler \
#     -f charts/hn-crawler/values-dev.yaml --set image.tag=<sha>
#
# Cheapest possible footprint: no autoscaling, no PDB (a single dev
# replica going down briefly is fine), ephemeral storage.

image:
  tag: dev

replicaCount: 1

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 250m
    memory: 192Mi

persistence:
  enabled: false

autoscaling:
  enabled: false

pdb:
  enabled: false
