services:
  crawler:
    build: .
    image: hn-crawler-starbuilder:local
    ports:
      - '3000:3000'
    environment:
      PORT: '3000'
      USAGE_DB_PATH: /app/data/usage.sqlite
    volumes:
      # Persist usage.sqlite across container restarts.
      - hn-crawler-data:/app/data
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 5s

volumes:
  hn-crawler-data:
