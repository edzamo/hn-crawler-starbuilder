apiVersion: apps/v1
kind: Deployment
metadata:
  name: hn-crawler
  labels:
    app: hn-crawler
spec:
  # SQLite is single-writer: usage.sqlite lives on one Pod's volume, so
  # scaling this past 1 replica would mean each Pod tracking its own
  # separate usage history instead of one shared log. Fine for this
  # exercise; a real multi-replica deployment would need the usage
  # store moved to a networked DB first.
  replicas: 1
  selector:
    matchLabels:
      app: hn-crawler
  template:
    metadata:
      labels:
        app: hn-crawler
    spec:
      containers:
        - name: hn-crawler
          # Built from the repo's Dockerfile. Replace with your
          # registry path (e.g. ghcr.io/you/hn-crawler-starbuilder:TAG)
          # before applying outside a local cluster.
          image: hn-crawler-starbuilder:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: hn-crawler-config
          volumeMounts:
            - name: usage-data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        # emptyDir keeps this a self-contained example: usage history
        # survives Pod restarts but not rescheduling to another node.
        # Swap for a PersistentVolumeClaim to keep it across node loss.
        - name: usage-data
          emptyDir: {}
