# Default values for hn-crawler.
# Cluster-agnostic on purpose: no hardcoded cloud-provider storage class,
# ingress class, or node selector. Override per-environment with
# `helm install -f values-prod.yaml` or `--set`.

replicaCount: 1

image:
  repository: hn-crawler-starbuilder
  tag: local
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

# Becomes the ConfigMap's data, and the container's env via envFrom.
env:
  PORT: "3000"
  USAGE_DB_PATH: /app/data/usage.sqlite

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

probes:
  path: /health
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 20

# usage.sqlite is single-writer, so replicaCount should stay 1 as long
# as persistence.enabled is true — see templates/NOTES.txt.
persistence:
  enabled: false
  size: 256Mi
  # Empty string lets the cluster pick its default StorageClass instead
  # of hardcoding one (gp2, standard, etc.) — this is what keeps the
  # chart portable across providers.
  storageClassName: ""
  accessMode: ReadWriteOnce

# Off by default: see the single-writer SQLite caveat above. Safe to
# enable only when persistence.enabled=false (each replica gets its
# own emptyDir and its own, siloed usage log) — enabling both at once
# means every replica fighting over the same PVC file. NOTES.txt warns
# on install if you combine them.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetMemoryUtilizationPercentage: 80

pdb:
  enabled: false
  minAvailable: 1
